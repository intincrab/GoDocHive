name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Use the latest patched Go rather than the exact version in go.mod:
      # govulncheck (below) also scans the standard library, so an unpatched
      # toolchain would fail the audit on stdlib CVEs.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # make audit runs: go mod verify, go vet, staticcheck, govulncheck,
      # and the race-enabled test suite. The ubuntu runner ships gcc, so the
      # cgo-backed -race detector works here.
      - name: audit
        run: make audit
